name: Bank of Mum v2 CI

on:
  push:
    branches:
      - phase-1-foundation
      - phase-2-ledger-audit
      - phase-3-interest-engine
      - phase-4-payment-planning
      - phase-5-scenarios
      - main
  pull_request:
    branches:
      - main
      - phase-1-foundation
      - phase-2-ledger-audit
      - phase-3-interest-engine
      - phase-4-payment-planning

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
